<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Shareholder Registration</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5 mb-5">

    <h2 class="mb-4">Shareholder Registration</h2>

    <form th:action="@{/shareholders}"
          th:object="${shareholder}"
          method="post">

        <!-- ==================== -->
        <!-- BASIC INFORMATION -->
        <!-- ==================== -->

        <div class="card mb-4">

            <div class="card-header">
                <h5 class="mb-0">Basic Information</h5>
            </div>

            <div class="card-body">

                <div class="row">

                    <!-- FOLIO/BO NUMBER -->
                    <div class="col-md-6 mb-3">

                        <label for="folioBo" class="form-label">
                            FOLIO/BO NUMBER <span class="text-danger">*</span>
                        </label>

                        <input type="text"
                               id="folioBo"
                               th:field="*{folioBo}"
                               class="form-control">

                        <div class="text-danger"
                             th:if="${#fields.hasErrors('folioBo')}"
                             th:errors="*{folioBo}">
                        </div>

                    </div>


                    <!-- CUSTOMER TYPE -->
                    <div class="col-md-6 mb-3">

                        <label for="customerType" class="form-label">
                            CUSTOMER TYPE <span class="text-danger">*</span>
                        </label>

                        <select id="customerType"
                                th:field="*{customerType}"
                                class="form-select">

                            <option value="">Select Customer Type</option>
                            <option value="1">Individual</option>
                            <option value="2">Institution</option>

                        </select>

                        <div class="text-danger"
                             th:if="${#fields.hasErrors('customerType')}"
                             th:errors="*{customerType}">
                        </div>

                    </div>


                    <!-- SHAREHOLDER NAME -->
                    <div class="col-md-6 mb-3">

                        <label for="shareholderName" class="form-label">
                            SHAREHOLDER NAME <span class="text-danger">*</span>
                        </label>

                        <input type="text"
                               id="shareholderName"
                               th:field="*{shareholderName}"
                               class="form-control">

                        <div class="text-danger"
                             th:if="${#fields.hasErrors('shareholderName')}"
                             th:errors="*{shareholderName}">
                        </div>

                    </div>


                    <!-- REPRESENTATIVE -->
                    <div class="col-md-6 mb-3">

                        <label for="representative" class="form-label">
                            REPRESENTATIVE (IF ANY)
                        </label>

                        <input type="text"
                               id="representative"
                               th:field="*{representative}"
                               class="form-control">

                        <div class="text-danger"
                             th:if="${#fields.hasErrors('representative')}"
                             th:errors="*{representative}">
                        </div>

                    </div>


                    <!-- CITIZEN TYPE -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            CITIZEN TYPE
                        </label>

                        <div>

                            <div class="form-check form-check-inline">

                                <input class="form-check-input"
                                       type="radio"
                                       id="local"
                                       th:field="*{citizenType}"
                                       value="1">

                                <label class="form-check-label" for="local">
                                    Local
                                </label>

                            </div>

                            <div class="form-check form-check-inline">

                                <input class="form-check-input"
                                       type="radio"
                                       id="foreign"
                                       th:field="*{citizenType}"
                                       value="2">

                                <label class="form-check-label" for="foreign">
                                    Foreign
                                </label>

                            </div>

                        </div>

                        <div class="text-danger"
                             th:if="${#fields.hasErrors('citizenType')}"
                             th:errors="*{citizenType}">
                        </div>

                    </div>


                    <!-- IS EMPLOYEE -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            IS EMPLOYEE <span class="text-danger">*</span>
                        </label>

                        <div>

                            <div class="form-check form-check-inline">

                                <input class="form-check-input"
                                       type="radio"
                                       id="employeeNo"
                                       th:field="*{isEmployee}"
                                       value="0">

                                <label class="form-check-label" for="employeeNo">
                                    No
                                </label>

                            </div>

                            <div class="form-check form-check-inline">

                                <input class="form-check-input"
                                       type="radio"
                                       id="employeeYes"
                                       th:field="*{isEmployee}"
                                       value="1">

                                <label class="form-check-label" for="employeeYes">
                                    Yes
                                </label>

                            </div>

                        </div>

                        <div class="text-danger"
                             th:if="${#fields.hasErrors('isEmployee')}"
                             th:errors="*{isEmployee}">
                        </div>

                    </div>


                    <!-- RESIDENCE TYPE -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            RESIDENCE TYPE <span class="text-danger">*</span>
                        </label>

                        <div>

                            <div class="form-check form-check-inline">

                                <input class="form-check-input"
                                       type="radio"
                                       id="resident"
                                       th:field="*{residenceType}"
                                       value="Resident">

                                <label class="form-check-label" for="resident">
                                    Resident
                                </label>

                            </div>

                            <div class="form-check form-check-inline">

                                <input class="form-check-input"
                                       type="radio"
                                       id="nonResident"
                                       th:field="*{residenceType}"
                                       value="Non-Resident">

                                <label class="form-check-label" for="nonResident">
                                    Non-Resident
                                </label>

                            </div>

                        </div>

                        <div class="text-danger"
                             th:if="${#fields.hasErrors('residenceType')}"
                             th:errors="*{residenceType}">
                        </div>

                    </div>


                    <!-- NID -->
                    <div class="col-md-6 mb-3">

                        <label for="nid" class="form-label">
                            NID
                        </label>

                        <input type="text"
                               id="nid"
                               th:field="*{nid}"
                               class="form-control">

                        <div class="text-danger"
                             th:if="${#fields.hasErrors('nid')}"
                             th:errors="*{nid}">
                        </div>

                    </div>


                    <!-- PHONE -->
                    <div class="col-md-6 mb-3">

                        <label for="phone" class="form-label">
                            PHONE NUMBER
                        </label>

                        <input type="text"
                               id="phone"
                               th:field="*{phone}"
                               class="form-control">

                        <div class="text-danger"
                             th:if="${#fields.hasErrors('phone')}"
                             th:errors="*{phone}">
                        </div>

                    </div>


                    <!-- TIN -->
                    <div class="col-md-6 mb-3">

                        <label for="tin" class="form-label">
                            TIN
                        </label>

                        <input type="text"
                               id="tin"
                               th:field="*{tin}"
                               class="form-control">

                        <div class="text-danger"
                             th:if="${#fields.hasErrors('tin')}"
                             th:errors="*{tin}">
                        </div>

                    </div>


                    <!-- EMAIL -->
                    <div class="col-md-6 mb-3">

                        <label for="email" class="form-label">
                            EMAIL
                        </label>

                        <input type="text"
                               id="email"
                               th:field="*{email}"
                               class="form-control">

                        <div class="text-danger"
                             th:if="${#fields.hasErrors('email')}"
                             th:errors="*{email}">
                        </div>

                    </div>


                    <!-- REGISTRATION DATE -->
                    <div class="col-md-6 mb-3">

                        <label for="registrationDate" class="form-label">
                            REGISTRATION DATE <span class="text-danger">*</span>
                        </label>

                        <input type="text"
                               id="registrationDate"
                               th:field="*{registrationDate}"
                               class="form-control"
                               placeholder="mm/dd/yyyy">

                        <div class="text-danger"
                             th:if="${#fields.hasErrors('registrationDate')}"
                             th:errors="*{registrationDate}">
                        </div>

                    </div>


                    <!-- ICB CODE -->
                    <div class="col-md-6 mb-3">

                        <label for="icbCode" class="form-label">
                            ICB CODE
                        </label>

                        <input type="number"
                               id="icbCode"
                               th:field="*{icbCode}"
                               class="form-control">

                        <div class="text-danger"
                             th:if="${#fields.hasErrors('icbCode')}"
                             th:errors="*{icbCode}">
                        </div>

                    </div>

                </div>

            </div>
        </div>


        <!-- ==================== -->
        <!-- ADDRESS -->
        <!-- ==================== -->

        <div class="card mb-4">

            <div class="card-header">
                <h5 class="mb-0">Address</h5>
            </div>

            <div class="card-body">

                <div class="row">

                    <!-- ADD1 -->
                    <div class="col-md-6 mb-3">

                        <label for="add1" class="form-label">
                            ADD1 <span class="text-danger">*</span>
                        </label>

                        <input type="text"
                               id="add1"
                               th:field="*{add1}"
                               class="form-control">

                        <div class="text-danger"
                             th:if="${#fields.hasErrors('add1')}"
                             th:errors="*{add1}">
                        </div>

                    </div>


                    <!-- ADD3 -->
                    <div class="col-md-6 mb-3">

                        <label for="add3" class="form-label">
                            ADD3
                        </label>

                        <input type="text"
                               id="add3"
                               th:field="*{add3}"
                               class="form-control">

                        <div class="text-danger"
                             th:if="${#fields.hasErrors('add3')}"
                             th:errors="*{add3}">
                        </div>

                    </div>


                    <!-- ADD2 -->
                    <div class="col-md-6 mb-3">

                        <label for="add2" class="form-label">
                            ADD2
                        </label>

                        <input type="text"
                               id="add2"
                               th:field="*{add2}"
                               class="form-control">

                        <div class="text-danger"
                             th:if="${#fields.hasErrors('add2')}"
                             th:errors="*{add2}">
                        </div>

                    </div>


                    <!-- ADD4 -->
                    <div class="col-md-6 mb-3">

                        <label for="add4" class="form-label">
                            ADD4
                        </label>

                        <input type="text"
                               id="add4"
                               th:field="*{add4}"
                               class="form-control">

                        <div class="text-danger"
                             th:if="${#fields.hasErrors('add4')}"
                             th:errors="*{add4}">
                        </div>

                    </div>


                    <!-- COUNTRY NAME -->
                    <div class="col-md-6 mb-3">

                        <label for="countryName" class="form-label">
                            COUNTRY NAME <span class="text-danger">*</span>
                        </label>

                        <input type="text"
                               id="countryName"
                               th:field="*{countryName}"
                               class="form-control">

                        <div class="text-danger"
                             th:if="${#fields.hasErrors('countryName')}"
                             th:errors="*{countryName}">
                        </div>

                    </div>

                </div>

            </div>
        </div>


        <!-- ==================== -->
        <!-- BANK INFORMATION -->
        <!-- ==================== -->

        <div class="card mb-4">

            <div class="card-header">
                <h5 class="mb-0">Bank Information</h5>
            </div>

            <div class="card-body">

                <div class="row">

                    <!-- BANK NAME -->
                    <div class="col-md-6 mb-3">

                        <label for="bankName" class="form-label">
                            BANK NAME
                        </label>

                        <input type="text"
                               id="bankName"
                               th:field="*{bankName}"
                               class="form-control">

                    </div>


                    <!-- BRANCH NAME -->
                    <div class="col-md-6 mb-3">

                        <label for="branchName" class="form-label">
                            BRANCH NAME
                        </label>

                        <input type="text"
                               id="branchName"
                               th:field="*{branchName}"
                               class="form-control">

                    </div>


                    <!-- ACCOUNT NUMBER -->
                    <div class="col-md-6 mb-3">

                        <label for="accountNumber" class="form-label">
                            ACCOUNT NUMBER
                        </label>

                        <input type="text"
                               id="accountNumber"
                               th:field="*{accountNumber}"
                               class="form-control">

                    </div>


                    <!-- ROUTING NUMBER -->
                    <div class="col-md-6 mb-3">

                        <label for="routingNumber" class="form-label">
                            ROUTING NUMBER
                        </label>

                        <input type="text"
                               id="routingNumber"
                               th:field="*{routingNumber}"
                               class="form-control">

                    </div>

                </div>

            </div>
        </div>


        <!-- ==================== -->
        <!-- ACTIONS -->
        <!-- ==================== -->

        <div class="d-flex justify-content-center gap-2">

            <button type="submit"
                    class="btn btn-primary">
                Submit
            </button>

            <button type="reset"
                    class="btn btn-secondary">
                Cancel
            </button>

        </div>

    </form>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
