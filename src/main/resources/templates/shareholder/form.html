<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shareholder Registration</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>



<div class="container mt-5">



    <h2 class="mb-4">Shareholder Registration</h2>

    <!-- Basic Information -->
    <div class="card mb-4">

        <div class="card-header">
            <h5 class="mb-0">Basic Information</h5>
        </div>

        <div class="card-body">

            <div class="row">

                <!-- Folio/BO Number -->
                <div class="col-md-6 mb-3">
                    <label for="folioBo" class="form-label">
                        FOLIO/BO NUMBER <span class="text-danger">*</span>
                    </label>

                    <input type="text"
                           id="folioBo"
                           name="folioBo"
                           class="form-control">
                </div>

                <!-- Customer Type -->
                <div class="col-md-6 mb-3">
                    <label for="customerType" class="form-label">
                        CUSTOMER TYPE <span class="text-danger">*</span>
                    </label>

                    <select id="customerType"
                            name="customerType"
                            class="form-select">

                        <option value="">Select Customer Type</option>

                    </select>
                </div>

            </div>

            <div class="row">

                <!-- Shareholder Name -->
                <div class="col-md-6 mb-3">
                    <label for="shareholderName" class="form-label">
                        SHAREHOLDER NAME <span class="text-danger">*</span>
                    </label>

                    <input type="text"
                           id="shareholderName"
                           name="shareholderName"
                           class="form-control">
                </div>

                <!-- Representative -->
                <div class="col-md-6 mb-3">
                    <label for="representative" class="form-label">
                        REPRESENTATIVE (IF ANY)
                    </label>

                    <input type="text"
                           id="representative"
                           name="representative"
                           class="form-control">
                </div>

            </div>

            <div class="row">

                <!-- Citizen Type -->
                <div class="col-md-6 mb-3">
                    <label class="form-label">
                        CITIZEN TYPE
                    </label>

                    <div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input"
                                   type="radio"
                                   name="citizenType"
                                   id="local"
                                   value="1"
                                   checked>

                            <label class="form-check-label" for="local">
                                Local
                            </label>
                        </div>

                        <div class="form-check form-check-inline">
                            <input class="form-check-input"
                                   type="radio"
                                   name="citizenType"
                                   id="foreign"
                                   value="2">

                            <label class="form-check-label" for="foreign">
                                Foreign
                            </label>
                        </div>
                    </div>
                </div>


                <!-- Is Employee -->
                <div class="col-md-6 mb-3">
                    <label class="form-label">
                        IS EMPLOYEE <span class="text-danger">*</span>
                    </label>

                    <div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input"
                                   type="radio"
                                   name="isEmployee"
                                   id="employeeNo"
                                   value="0"
                                   checked>

                            <label class="form-check-label" for="employeeNo">
                                No
                            </label>
                        </div>

                        <div class="form-check form-check-inline">
                            <input class="form-check-input"
                                   type="radio"
                                   name="isEmployee"
                                   id="employeeYes"
                                   value="1">

                            <label class="form-check-label" for="employeeYes">
                                Yes
                            </label>
                        </div>
                    </div>
                </div>

            </div>

            <div class="row">

                <!-- Residence Type -->
                <div class="col-md-6 mb-3">
                    <label class="form-label">
                        RESIDENCE TYPE
                    </label>

                    <div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input"
                                   type="radio"
                                   name="residenceType"
                                   id="resident"
                                   value="Resident"
                                   checked>

                            <label class="form-check-label" for="resident">
                                Resident
                            </label>
                        </div>

                        <div class="form-check form-check-inline">
                            <input class="form-check-input"
                                   type="radio"
                                   name="residenceType"
                                   id="nonResident"
                                   value="Non-Resident">

                            <label class="form-check-label" for="nonResident">
                                Non-Resident
                            </label>
                        </div>
                    </div>
                </div>


                <!-- NID -->
                <div class="col-md-6 mb-3">
                    <label for="nid" class="form-label">
                        NID
                    </label>

                    <input type="text"
                           id="nid"
                           name="nid"
                           class="form-control">
                </div>

            </div>

            <div class="row">

                <!-- Phone Number -->
                <div class="col-md-6 mb-3">
                    <label for="phone" class="form-label">
                        PHONE NUMBER
                    </label>

                    <input type="tel"
                           id="phone"
                           name="phone"
                           class="form-control">
                </div>


                <!-- TIN -->
                <div class="col-md-6 mb-3">
                    <label for="tin" class="form-label">
                        TIN
                    </label>

                    <input type="text"
                           id="tin"
                           name="tin"
                           class="form-control">
                </div>

            </div>

            <div class="row">

                <!-- Email -->
                <div class="col-md-6 mb-3">
                    <label for="email" class="form-label">
                        EMAIL
                    </label>

                    <input type="email"
                           id="email"
                           name="email"
                           class="form-control">
                </div>


                <!-- Registration Date -->
                <div class="col-md-6 mb-3">
                    <label for="registrationDate" class="form-label">
                        REGISTRATION DATE <span class="text-danger">*</span>
                    </label>

                    <input type="date"
                           id="registrationDate"
                           name="registrationDate"
                           class="form-control">
                </div>

            </div>

            <div class="row">

                <!-- Empty left column -->
                <div class="col-md-6 mb-3">
                </div>


                <!-- ICB Code -->
                <div class="col-md-6 mb-3">
                    <label for="icbCode" class="form-label">
                        ICB CODE
                    </label>

                    <input type="text"
                           id="icbCode"
                           name="icbCode"
                           class="form-control">
                </div>

            </div>

        </div>
    </div>

</div>

</body>
</html>
