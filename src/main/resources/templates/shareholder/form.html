<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    ```
    <title>Shareholder Registration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    ```

</head>

<body>

<div class="container mt-5 mb-5">

    ```
    <h2 class="mb-4">Shareholder Registration</h2>

    <form th:action="@{/shareholders}"
          th:object="${shareholderForm}"
          method="post">

        <!-- ==================== -->
        <!-- BASIC INFORMATION -->
        <!-- ==================== -->

        <div class="card mb-4">

            <div class="card-header">
                <h5 class="mb-0">Basic Information</h5>
            </div>

            <div class="card-body">

                <div class="row">

                    <!-- FOLIO/BO NUMBER -->
                    <div class="col-md-6 mb-3">

                        <label for="folioBo" class="form-label">
                            FOLIO/BO NUMBER <span class="text-danger">*</span>
                        </label>

                        <input type="text"
                               id="folioBo"
                               th:field="*{shareholder.folioBo}"
                               class="form-control">

                        <div class="text-danger"
                             th:if="${#fields.hasErrors('shareholder.folioBo')}"
                             th:errors="*{shareholder.folioBo}">
                        </div>

                    </div>


                    <!-- CUSTOMER TYPE -->
                    <div class="col-md-6 mb-3">

                        <label for="customerType" class="form-label">
                            CUSTOMER TYPE <span class="text-danger">*</span>
                        </label>

                        <select id="customerType"
                                th:field="*{shareholder.customerType}"
                                class="form-select">

                            <option value="">Select Customer Type</option>
                            <option value="1">Individual</option>
                            <option value="2">Institution</option>

                        </select>

                        <div class="text-danger"
                             th:if="${#fields.hasErrors('shareholder.customerType')}"
                             th:errors="*{shareholder.customerType}">
                        </div>

                    </div>


                    <!-- SHAREHOLDER NAME -->
                    <div class="col-md-6 mb-3">

                        <label for="shareholderName" class="form-label">
                            SHAREHOLDER NAME <span class="text-danger">*</span>
                        </label>

                        <input type="text"
                               id="shareholderName"
                               th:field="*{shareholder.shareholderName}"
                               class="form-control">

                        <div class="text-danger"
                             th:if="${#fields.hasErrors('shareholder.shareholderName')}"
                             th:errors="*{shareholder.shareholderName}">
                        </div>

                    </div>


                    <!-- REPRESENTATIVE -->
                    <div class="col-md-6 mb-3">

                        <label for="representative" class="form-label">
                            REPRESENTATIVE (IF ANY)
                        </label>

                        <input type="text"
                               id="representative"
                               th:field="*{shareholder.representative}"
                               class="form-control">

                        <div class="text-danger"
                             th:if="${#fields.hasErrors('shareholder.representative')}"
                             th:errors="*{shareholder.representative}">
                        </div>

                    </div>


                    <!-- CITIZEN TYPE -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            CITIZEN TYPE
                        </label>

                        <div>

                            <div class="form-check form-check-inline">

                                <input class="form-check-input"
                                       type="radio"
                                       id="local"
                                       th:field="*{shareholder.citizenType}"
                                       value="1">

                                <label class="form-check-label" for="local">
                                    Local
                                </label>

                            </div>

                            <div class="form-check form-check-inline">

                                <input class="form-check-input"
                                       type="radio"
                                       id="foreign"
                                       th:field="*{shareholder.citizenType}"
                                       value="2">

                                <label class="form-check-label" for="foreign">
                                    Foreign
                                </label>

                            </div>

                        </div>

                        <div class="text-danger"
                             th:if="${#fields.hasErrors('shareholder.citizenType')}"
                             th:errors="*{shareholder.citizenType}">
                        </div>

                    </div>


                    <!-- IS EMPLOYEE -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            IS EMPLOYEE <span class="text-danger">*</span>
                        </label>

                        <div>

                            <div class="form-check form-check-inline">

                                <input class="form-check-input"
                                       type="radio"
                                       id="employeeNo"
                                       th:field="*{shareholder.isEmployee}"
                                       value="0">

                                <label class="form-check-label" for="employeeNo">
                                    No
                                </label>

                            </div>

                            <div class="form-check form-check-inline">

                                <input class="form-check-input"
                                       type="radio"
                                       id="employeeYes"
                                       th:field="*{shareholder.isEmployee}"
                                       value="1">

                                <label class="form-check-label" for="employeeYes">
                                    Yes
                                </label>

                            </div>

                        </div>

                        <div class="text-danger"
                             th:if="${#fields.hasErrors('shareholder.isEmployee')}"
                             th:errors="*{shareholder.isEmployee}">
                        </div>

                    </div>


                    <!-- RESIDENCE TYPE -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            RESIDENCE TYPE <span class="text-danger">*</span>
                        </label>

                        <div>

                            <div class="form-check form-check-inline">

                                <input class="form-check-input"
                                       type="radio"
                                       id="resident"
                                       th:field="*{shareholder.residenceType}"
                                       value="Resident">

                                <label class="form-check-label" for="resident">
                                    Resident
                                </label>

                            </div>

                            <div class="form-check form-check-inline">

                                <input class="form-check-input"
                                       type="radio"
                                       id="nonResident"
                                       th:field="*{shareholder.residenceType}"
                                       value="Non-Resident">

                                <label class="form-check-label" for="nonResident">
                                    Non-Resident
                                </label>

                            </div>

                        </div>

                        <div class="text-danger"
                             th:if="${#fields.hasErrors('shareholder.residenceType')}"
                             th:errors="*{shareholder.residenceType}">
                        </div>

                    </div>


                    <!-- NID -->
                    <div class="col-md-6 mb-3">

                        <label for="nid" class="form-label">
                            NID
                        </label>

                        <input type="text"
                               id="nid"
                               th:field="*{shareholder.nid}"
                               class="form-control">

                        <div class="text-danger"
                             th:if="${#fields.hasErrors('shareholder.nid')}"
                             th:errors="*{shareholder.nid}">
                        </div>

                    </div>


                    <!-- PHONE -->
                    <div class="col-md-6 mb-3">

                        <label for="phone" class="form-label">
                            PHONE NUMBER
                        </label>

                        <input type="text"
                               id="phone"
                               th:field="*{shareholder.phone}"
                               class="form-control">

                        <div class="text-danger"
                             th:if="${#fields.hasErrors('shareholder.phone')}"
                             th:errors="*{shareholder.phone}">
                        </div>

                    </div>


                    <!-- TIN -->
                    <div class="col-md-6 mb-3">

                        <label for="tin" class="form-label">
                            TIN
                        </label>

                        <input type="text"
                               id="tin"
                               th:field="*{shareholder.tin}"
                               class="form-control">

                        <div class="text-danger"
                             th:if="${#fields.hasErrors('shareholder.tin')}"
                             th:errors="*{shareholder.tin}">
                        </div>

                    </div>


                    <!-- EMAIL -->
                    <div class="col-md-6 mb-3">

                        <label for="email" class="form-label">
                            EMAIL
                        </label>

                        <input type="text"
                               id="email"
                               th:field="*{shareholder.email}"
                               class="form-control">

                        <div class="text-danger"
                             th:if="${#fields.hasErrors('shareholder.email')}"
                             th:errors="*{shareholder.email}">
                        </div>

                    </div>


                    <!-- REGISTRATION DATE -->
                    <div class="col-md-6 mb-3">

                        <label for="registrationDate" class="form-label">
                            REGISTRATION DATE <span class="text-danger">*</span>
                        </label>

                        <input type="text"
                               id="registrationDate"
                               th:field="*{shareholder.registrationDate}"
                               class="form-control"
                               placeholder="mm/dd/yyyy">

                        <div class="text-danger"
                             th:if="${#fields.hasErrors('shareholder.registrationDate')}"
                             th:errors="*{shareholder.registrationDate}">
                        </div>

                    </div>


                    <!-- ICB CODE -->
                    <div class="col-md-6 mb-3">

                        <label for="icbCode" class="form-label">
                            ICB CODE
                        </label>

                        <input type="number"
                               id="icbCode"
                               th:field="*{shareholder.icbCode}"
                               class="form-control">

                        <div class="text-danger"
                             th:if="${#fields.hasErrors('shareholder.icbCode')}"
                             th:errors="*{shareholder.icbCode}">
                        </div>

                    </div>

                </div>

            </div>
        </div>


        <!-- ==================== -->
        <!-- ADDRESS -->
        <!-- ==================== -->

        <div class="card mb-4">

            <div class="card-header">
                <h5 class="mb-0">Address</h5>
            </div>

            <div class="card-body">

                <div class="row">

                    <!-- ADD1 -->
                    <div class="col-md-6 mb-3">

                        <label for="add1" class="form-label">
                            ADD1 <span class="text-danger">*</span>
                        </label>

                        <input type="text"
                               id="add1"
                               th:field="*{address.add1}"
                               class="form-control">

                        <div class="text-danger"
                             th:if="${#fields.hasErrors('address.add1')}"
                             th:errors="*{address.add1}">
                        </div>

                    </div>


                    <!-- ADD3 -->
                    <div class="col-md-6 mb-3">

                        <label for="add3" class="form-label">
                            ADD3
                        </label>

                        <input type="text"
                               id="add3"
                               th:field="*{address.add3}"
                               class="form-control">

                        <div class="text-danger"
                             th:if="${#fields.hasErrors('address.add3')}"
                             th:errors="*{address.add3}">
                        </div>

                    </div>


                    <!-- ADD2 -->
                    <div class="col-md-6 mb-3">

                        <label for="add2" class="form-label">
                            ADD2
                        </label>

                        <input type="text"
                               id="add2"
                               th:field="*{address.add2}"
                               class="form-control">

                        <div class="text-danger"
                             th:if="${#fields.hasErrors('address.add2')}"
                             th:errors="*{address.add2}">
                        </div>

                    </div>


                    <!-- ADD4 -->
                    <div class="col-md-6 mb-3">

                        <label for="add4" class="form-label">
                            ADD4
                        </label>

                        <input type="text"
                               id="add4"
                               th:field="*{address.add4}"
                               class="form-control">

                        <div class="text-danger"
                             th:if="${#fields.hasErrors('address.add4')}"
                             th:errors="*{address.add4}">
                        </div>

                    </div>


                    <!-- COUNTRY NAME -->
                    <div class="col-md-6 mb-3">

                        <label for="countryName" class="form-label">
                            COUNTRY NAME <span class="text-danger">*</span>
                        </label>

                        <input type="text"
                               id="countryName"
                               th:field="*{address.countryName}"
                               class="form-control">

                        <div class="text-danger"
                             th:if="${#fields.hasErrors('address.countryName')}"
                             th:errors="*{address.countryName}">
                        </div>

                    </div>

                </div>

            </div>
        </div>


        <!-- ==================== -->
        <!-- BANK INFORMATION -->
        <!-- ==================== -->

        <div class="card mb-4">

            <div class="card-header">
                <h5 class="mb-0">Bank Information</h5>
            </div>

            <div class="card-body">

                <div class="row">

                    <!-- BANK NAME -->
                    <div class="col-md-6 mb-3">

                        <label for="bankName" class="form-label">
                            BANK NAME
                        </label>

                        <input type="text"
                               id="bankName"
                               class="form-control">

                    </div>


                    <!-- BRANCH NAME -->
                    <div class="col-md-6 mb-3">

                        <label for="branchName" class="form-label">
                            BRANCH NAME
                        </label>

                        <input type="text"
                               id="branchName"
                               class="form-control">

                    </div>


                    <!-- ACCOUNT NUMBER -->
                    <div class="col-md-6 mb-3">

                        <label for="accountNumber" class="form-label">
                            ACCOUNT NUMBER
                        </label>

                        <input type="text"
                               id="accountNumber"
                               class="form-control">

                    </div>


                    <!-- ROUTING NUMBER -->
                    <div class="col-md-6 mb-3">

                        <label for="routingNumber" class="form-label">
                            ROUTING NUMBER
                        </label>

                        <input type="text"
                               id="routingNumber"
                               class="form-control">

                    </div>

                </div>

            </div>
        </div>


        <!-- ==================== -->
        <!-- ACTIONS -->
        <!-- ==================== -->

        <div class="d-flex justify-content-center gap-2">

            <button type="submit"
                    class="btn btn-primary">
                Submit
            </button>

            <button type="reset"
                    class="btn btn-secondary">
                Cancel
            </button>

        </div>

    </form>
    ```

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
