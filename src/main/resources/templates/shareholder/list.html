<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Shareholders</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5 mb-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>Shareholders</h2>

        <a th:href="@{/shareholders/new}"
           class="btn btn-primary">
            Add Shareholder
        </a>

    </div>


    <div class="card">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-bordered table-hover">

                    <thead class="table-light">

                    <tr>
                        <th>FOLIO/BO</th>
                        <th>NAME</th>
                        <th>CUSTOMER TYPE</th>
                        <th>PHONE</th>
                        <th>EMAIL</th>
                        <th>RESIDENCE TYPE</th>
                        <th>REGISTRATION DATE</th>
                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="shareholder : ${shareholders}">

                        <td th:text="${shareholder.folioBo}">
                            123456
                        </td>

                        <td th:text="${shareholder.custName}">
                            John Doe
                        </td>

                        <td th:text="${shareholder.custType}">
                            1
                        </td>

                        <td th:text="${shareholder.phone}">
                            01700000000
                        </td>

                        <td th:text="${shareholder.email}">
                            example@email.com
                        </td>

                        <td th:text="${shareholder.residentType}">
                            Resident
                        </td>

                        <td th:text="${shareholder.registrationDate}">
                            2026-08-31
                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
